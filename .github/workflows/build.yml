name: build

# Uploading the APK to a release needs write access; the default token is read-only.
permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK; setup-android@v3 breaks on newer
      # images because the legacy "tools" package no longer exists in the repository.
      - name: Build
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: TVButton-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
