plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.button'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.button'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Signed with the local debug key so `pm install -r` upgrades the installed build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
